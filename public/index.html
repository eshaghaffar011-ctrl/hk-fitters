<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Primary SEO -->
    <title>HK FITTERS | Custom Sportswear Manufacturer & Exporter</title>

    <meta
      name="description"
      content="HK FITTERS is a custom sportswear manufacturer and exporter offering OEM, private label, bulk production, custom designs, and worldwide sportswear manufacturing for brands, wholesalers, retailers, and businesses."
    />

    <meta name="author" content="HK FITTERS" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Viewport & Theme -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="theme-color" content="#000000" />

    <!-- Google Search Console Verification -->
    <meta
      name="google-site-verification"
      content="3mB59qZBEmFw9tKBbj8lQGLhL6xQj-KaGGsWjbYGYeA"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://hk-fitters.vercel.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/logo/hk-logo-256.png"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="HK FITTERS"
    />

    <meta
      property="og:title"
      content="HK FITTERS | Custom Sportswear Manufacturer & Exporter"
    />

    <meta
      property="og:description"
      content="Custom sportswear manufacturing, OEM, private label, bulk production and worldwide export solutions for sportswear brands, wholesalers, retailers and businesses."
    />

    <meta
      property="og:url"
      content="https://hk-fitters.vercel.app/"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="HK FITTERS | Custom Sportswear Manufacturer & Exporter"
    />

    <meta
      name="twitter:description"
      content="Custom sportswear manufacturing, OEM, private label, bulk orders and worldwide export solutions by HK FITTERS."
    />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>

</html>
